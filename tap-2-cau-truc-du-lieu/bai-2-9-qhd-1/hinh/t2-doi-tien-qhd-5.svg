<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif"><rect width="760" height="240" rx="14" fill="#ffffff"/><rect x="12" y="12" width="736" height="50" rx="12" fill="#eef0fb"/><rect x="12" y="12" width="5" height="50" rx="2" fill="#4338ca"/><text x="30" y="34" font-size="12" font-weight="700" fill="#4338ca" text-anchor="start">Bước 5/8</text><text x="30" y="54" font-size="14.5" font-weight="600" fill="#1b1d3a" text-anchor="start">s = 4: đồng cuối là 1 / 3 / 4: dp[3] + 1 = 2, dp[1] + 1 = 2, dp[0] + 1 = 1. dp[4] = 1.</text><text x="20" y="94" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">dp[s] (số dưới: s); mệnh giá 1, 3, 4</text><rect x="20" y="102" width="44" height="38" rx="8" fill="#d5eff4" stroke="#0e7490" stroke-width="2"/><text x="42" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">0</text><text x="42" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">0</text><rect x="69" y="102" width="44" height="38" rx="8" fill="#d5eff4" stroke="#0e7490" stroke-width="2"/><text x="91" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">1</text><text x="91" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">1</text><rect x="118" y="102" width="44" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="140" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">2</text><text x="140" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">2</text><rect x="167" y="102" width="44" height="38" rx="8" fill="#d5eff4" stroke="#0e7490" stroke-width="2"/><text x="189" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">1</text><text x="189" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">3</text><rect x="216" y="102" width="44" height="38" rx="8" fill="#fdebd6" stroke="#ea7a12" stroke-width="2"/><text x="238" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">1</text><text x="238" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">4</text><rect x="265" y="102" width="44" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="287" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">∞</text><text x="287" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">5</text><rect x="314" y="102" width="44" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="336" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">∞</text><text x="336" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">6</text><text x="20" y="182" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Biến</text><rect x="20" y="190" width="61" height="28" rx="8" fill="#fdebd6" stroke="#ea7a12" stroke-width="1.5"/><text x="29" y="209" font-size="13" font-weight="400" fill="#1b1d3a" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">s = 4</text></svg>