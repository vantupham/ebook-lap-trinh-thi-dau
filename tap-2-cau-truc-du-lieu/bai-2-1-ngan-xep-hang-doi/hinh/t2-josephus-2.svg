<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif"><rect width="760" height="340" rx="14" fill="#ffffff"/><rect x="12" y="12" width="736" height="50" rx="12" fill="#eef0fb"/><rect x="12" y="12" width="5" height="50" rx="2" fill="#4338ca"/><text x="30" y="34" font-size="12" font-weight="700" fill="#4338ca" text-anchor="start">Bước 2/16</text><text x="30" y="54" font-size="14.5" font-weight="600" fill="#1b1d3a" text-anchor="start">Người 1 được bỏ qua: rời đầu hàng, xếp lại cuối hàng.</text><text x="20" y="94" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Hàng đợi (đầu ← … ← cuối)</text><rect x="20" y="120" width="44" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="42" y="144" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">2</text><text x="42" y="114" font-size="12" font-weight="700" fill="#ea7a12" text-anchor="middle">đầu ↓</text><rect x="69" y="120" width="44" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="91" y="144" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">3</text><rect x="118" y="120" width="44" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="140" y="144" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">4</text><rect x="167" y="120" width="44" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="189" y="144" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">5</text><rect x="216" y="120" width="44" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="238" y="144" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">6</text><rect x="265" y="120" width="44" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="287" y="144" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">7</text><rect x="314" y="120" width="44" height="38" rx="8" fill="#d5eff4" stroke="#0e7490" stroke-width="2"/><text x="336" y="144" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">1</text><text x="336" y="114" font-size="12" font-weight="700" fill="#ea7a12" text-anchor="middle">cuối ↓</text><text x="20" y="206" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Đã bị loại (theo thứ tự)</text><text x="20" y="236" font-size="13" font-weight="400" fill="#5d6188" text-anchor="start">(rỗng)</text><text x="20" y="282" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Biến</text><rect x="20" y="290" width="112.6" height="28" rx="8" fill="#f6f7fc" stroke="#dcdff0" stroke-width="1.5"/><text x="29" y="309" font-size="13" font-weight="400" fill="#1b1d3a" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">còn lại = 7</text></svg>