<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" width="760" height="348" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif"><rect width="760" height="348" rx="14" fill="#ffffff"/><rect x="12" y="12" width="736" height="70" rx="12" fill="#eef0fb"/><rect x="12" y="12" width="5" height="70" rx="2" fill="#4338ca"/><text x="30" y="34" font-size="12" font-weight="700" fill="#4338ca" text-anchor="start">Bước 1/5</text><text x="30" y="54" font-size="14.5" font-weight="600" fill="#1b1d3a" text-anchor="start">N = 100. Viết số từ trái sang phải. Ban đầu chưa có tiền tố nào nhỏ hơn N; nhánh &quot;bám sát N&quot;</text><text x="30" y="74" font-size="14.5" font-weight="600" fill="#1b1d3a" text-anchor="start">còn hợp lệ.</text><text x="20" y="114" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Các chữ số của N</text><rect x="20" y="122" width="44" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="42" y="146" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">1</text><text x="42" y="175" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">vị trí 0</text><rect x="69" y="122" width="44" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="91" y="146" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">0</text><text x="91" y="175" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">vị trí 1</text><rect x="118" y="122" width="44" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="140" y="146" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">0</text><text x="140" y="175" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">vị trí 2</text><text x="20" y="202" font-size="12" font-weight="600" fill="#5d6188" text-anchor