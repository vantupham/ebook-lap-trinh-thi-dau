<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif"><rect width="760" height="392" rx="14" fill="#ffffff"/><rect x="12" y="12" width="736" height="50" rx="12" fill="#eef0fb"/><rect x="12" y="12" width="5" height="50" rx="2" fill="#4338ca"/><text x="30" y="34" font-size="12" font-weight="700" fill="#4338ca" text-anchor="start">Bước 3/6</text><text x="30" y="54" font-size="14.5" font-weight="600" fill="#1b1d3a" text-anchor="start">Lấy (2, 3): chốt d[3] = 2. Cải thiện: d[2] = 5.</text><text x="20" y="94" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">d[v] (số dưới: đỉnh v; xanh lá: đã chốt)</text><rect x="20" y="102" width="44" height="38" rx="8" fill="#dcf3e3" stroke="#15803d" stroke-width="2"/><text x="42" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">0</text><text x="42" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">1</text><rect x="69" y="102" width="44" height="38" rx="8" fill="#d5eff4" stroke="#0e7490" stroke-width="2"/><text x="91" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">5</text><text x="91" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">2</text><rect x="118" y="102" width="44" height="38" rx="8" fill="#fdebd6" stroke="#ea7a12" stroke-width="2"/><text x="140" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">2</text><text x="140" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">3</text><text x="20" y="182" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Heap nhỏ nhất (khoảng cách:đỉnh)</text><rect x="20" y="190" width="46" height="38" rx="8" fill="#d5eff4" stroke="#0e7490" stroke-width="2"/><text x="43" y="214" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">5:2</text><rect x="71" y="190" width="46" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="94" y="214" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">6:2</text><text x="20" y="258" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Cạnh đi ra từ 3 (đích, độ dài)</text><rect x="20" y="266" width="74" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="57" y="290" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">→2 (3)</text><text x="20" y="334" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Biến</text><rect x="20" y="342" width="61" height="28" rx="8" fill="#fdebd6" stroke="#ea7a12" stroke-width="1.5"/><text x="29" y="361" font-size="13" font-weight="400" fill="#1b1d3a" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">u = 3</text></svg>