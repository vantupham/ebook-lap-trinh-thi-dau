# Tự dựng trang web và đăng lên GitHub Pages mỗi khi đẩy lên nhánh main.
# Bật một lần: Settings → Pages → Source: GitHub Actions.
name: Đăng trang web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài MkDocs Material
        run: pip install -r web/requirements.txt
      - name: Chuẩn bị nội dung và dựng trang
        run: |
          python web/chuan_bi.py
          mkdocs build --config-file build/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
