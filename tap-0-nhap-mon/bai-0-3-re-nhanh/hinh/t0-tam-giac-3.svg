<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 178" width="760" height="178" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif"><rect width="760" height="178" rx="14" fill="#ffffff"/><rect x="12" y="12" width="736" height="50" rx="12" fill="#eef0fb"/><rect x="12" y="12" width="5" height="50" rx="2" fill="#4338ca"/><text x="30" y="34" font-size="12" font-weight="700" fill="#4338ca" text-anchor="start">Bước 3/5</text><text x="30" y="54" font-size="14.5" font-weight="600" fill="#1b1d3a" text-anchor="start">Kiểm tra a == c ?  3 ≠ 5 → sai.</text><text x="20" y="94" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Ba cạnh sau khi sắp xếp (a ≤ b ≤ c)</text><rect x="20" y="102" width="44" height="38" rx="8" fill="#fdebd6" stroke="#ea7a12" stroke-width="2"/><text x="42" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">3</text><text x="42" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">a</text><rect x="69" y="102" width="44" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="91" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">4</text><text x="91" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">b</text><rect x="118" y="102" width="44" height="38" rx="8" fill="#fdebd6" stroke="#ea7a12" stroke-width="2"/><text x="140" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">5</text><text x="140" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">c</text></svg>