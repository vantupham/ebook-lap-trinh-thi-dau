<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" width="760" height="228" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif"><rect width="760" height="228" rx="14" fill="#ffffff"/><rect x="12" y="12" width="736" height="50" rx="12" fill="#eef0fb"/><rect x="12" y="12" width="5" height="50" rx="2" fill="#4338ca"/><text x="30" y="34" font-size="12" font-weight="700" fill="#4338ca" text-anchor="start">Bước 2/8</text><text x="30" y="54" font-size="14.5" font-weight="600" fill="#1b1d3a" text-anchor="start">4 mod 6 = 4. Cặp mới: (6, 4).</text><text x="20" y="94" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Các cặp (a, b) đã đi qua</text><rect x="20" y="102" width="90" height="38" rx="8" fill="#fdebd6" stroke="#ea7a12" stroke-width="2"/><text x="65" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">(4, 6)</text><text x="20" y="170" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Biến</text><rect x="20" y="178" width="61" height="28" rx="8" fill="#f6f7fc" stroke="#dcdff0" stroke-width="1.5"/><text x="29" y="197" font-size="13" font-weight="400" fill="#1b1d3a" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">a = 4</text><rect x="89" y="178" width="61" height="28" rx="8" fill="#f6f7fc" stroke="#dcdff0" stroke-width="1.5"/><text x="98" y="197" font-size="13" font-weight="400" fill="#1b1d3a" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">b = 6</text><rect x="158" y="178" width="112.6" height="28" rx="8" fill="#fdebd6" stroke="#ea7a12" stroke-width="1.5"/><text x="167" y="197" font-size="13" font-weight="400" fill="#1b1d3a" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">a mod b = 4</text></svg>