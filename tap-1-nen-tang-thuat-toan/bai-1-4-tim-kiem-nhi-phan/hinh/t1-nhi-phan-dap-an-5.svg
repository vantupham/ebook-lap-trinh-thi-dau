<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="760" height="304" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif"><rect width="760" height="304" rx="14" fill="#ffffff"/><rect x="12" y="12" width="736" height="50" rx="12" fill="#eef0fb"/><rect x="12" y="12" width="5" height="50" rx="2" fill="#4338ca"/><text x="30" y="34" font-size="12" font-weight="700" fill="#4338ca" text-anchor="start">Bước 10/10</text><text x="30" y="54" font-size="14.5" font-weight="600" fill="#1b1d3a" text-anchor="start">lo = hi = 8 sau 4 lần kiểm tra. Kiểm tra lại: 8 giây làm được 7 ≥ 7, còn 7 giây chỉ được 6.</text><text x="20" y="94" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Mỗi máy làm được trong mid giây (mid / kᵢ)</text><rect x="20" y="102" width="70" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="55" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">2</text><text x="55" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">k = 3</text><rect x="95" y="102" width="70" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="130" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">4</text><text x="130" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">k = 2</text><rect x="170" y="102" width="70" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="205" y="126" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">1</text><text x="205" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">k = 5</text><text x="20" y="182" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Biến</text><rect x="20" y="190" width="69.6" height="28" rx="8" fill="#f6f7fc" stroke="#dcdff0" stroke-width="1.5"/><text x="29" y="209" font-size="13" font-weight="400" fill="#1b1d3a" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">lo = 8</text><rect x="97.6" y="190" width="69.6" height="28" rx="8" fill="#f6f7fc" stroke="#dcdff0" stroke-width="1.5"/><text x="106.6" y="209" font-size="13" font-weight="400" fill="#1b1d3a" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">hi = 8</text><text x="20" y="244" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Kết quả in ra</text><rect x="20" y="252" width="720" height="34" rx="8" fill="#dcf3e3" stroke="#15803d" stroke-width="1.5"/><text x="32" y="274" font-size="14" font-weight="600" fill="#1b1d3a" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">8</text></svg>