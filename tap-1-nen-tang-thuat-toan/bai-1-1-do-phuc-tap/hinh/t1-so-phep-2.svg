<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif"><rect width="760" height="240" rx="14" fill="#ffffff"/><rect x="12" y="12" width="736" height="50" rx="12" fill="#eef0fb"/><rect x="12" y="12" width="5" height="50" rx="2" fill="#4338ca"/><text x="30" y="34" font-size="12" font-weight="700" fill="#4338ca" text-anchor="start">Bước 2/3</text><text x="30" y="54" font-size="14.5" font-weight="600" fill="#1b1d3a" text-anchor="start">Cách 2 cộng dồn khi tăng r: khoảng n²/2 = 2.0·10^10 phép. C++: 200 giây; Python: 2000 giây.</text><text x="20" y="94" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Số phép (xấp xỉ)</text><rect x="20" y="102" width="150" height="38" rx="8" fill="#f9e0dc" stroke="#c0392b" stroke-width="2"/><text x="95" y="126" font-size="15" font-weight="600" fill="#c0392b" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" text-decoration="line-through">1.3·10^15</text><text x="95" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">O(n³)</text><rect x="175" y="102" width="150" height="38" rx="8" fill="#f9e0dc" stroke="#c0392b" stroke-width="2"/><text x="250" y="126" font-size="15" font-weight="600" fill="#c0392b" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" text-decoration="line-through">2.0·10^10</text><text x="250" y="155" font-size="11" font-weight="400" fill="#5d6188" text-anchor="middle">O(n²)</text><text x="20" y="182" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Biến</text><rect x="20" y="190" width="104" height="28" rx="8" fill="#f6f7fc" stroke="#dcdff0" stroke-width="1.5"/><text x="29" y="209" font-size="13" font-weight="400" fill="#1b1d3a" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">n = 200000</text></svg>