<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif"><rect width="760" height="324" rx="14" fill="#ffffff"/><rect x="12" y="12" width="736" height="70" rx="12" fill="#eef0fb"/><rect x="12" y="12" width="5" height="70" rx="2" fill="#4338ca"/><text x="30" y="34" font-size="12" font-weight="700" fill="#4338ca" text-anchor="start">Bước 3/4</text><text x="30" y="54" font-size="14.5" font-weight="600" fill="#1b1d3a" text-anchor="start">Đường tăng 2: 1 → 3 → 2 → 4, đẩy thêm 1. Đi qua 1 cạnh ngược (đỏ): rút lại luồng cũ. Luồng =</text><text x="30" y="74" font-size="14.5" font-weight="600" fill="#1b1d3a" text-anchor="start">2.</text><text x="20" y="114" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Các cạnh gốc (luồng / khả năng)</text><rect x="20" y="122" width="94" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="67" y="146" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">1→2: 1/1</text><rect x="119" y="122" width="94" height="38" rx="8" fill="#dcf3e3" stroke="#15803d" stroke-width="2"/><text x="166" y="146" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">1→3: 1/1</text><rect x="218" y="122" width="94" height="38" rx="8" fill="#f9e0dc" stroke="#c0392b" stroke-width="2"/><text x="265" y="146" font-size="15" font-weight="600" fill="#c0392b" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" text-decoration="line-through">2→3: 0/1</text><rect x="317" y="122" width="94" height="38" rx="8" fill="#dcf3e3" stroke="#15803d" stroke-width="2"/><text x="364" y="146" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">2→4: 1/1</text><rect x="416" y="122" width="94" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="463" y="146" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">3→4: 1/1</text><text x="20" y="190" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Khả năng dư của cạnh ngược (= luồng đang chảy)</text><rect x="20" y="198" width="80" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="60" y="222" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">2→1: 1</text><rect x="105" y="198" width="80" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="145" y="222" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">3→1: 1</text><rect x="190" y="198" width="80" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="230" y="222" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">3→2: 0</text><rect x="275" y="198" width="80" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="315" y="222" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">4→2: 1</text><rect x="360" y="198" width="80" height="38" rx="8" fill="#ffffff" stroke="#dcdff0" stroke-width="2"/><text x="400" y="222" font-size="15" font-weight="600" fill="#1b1d3a" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace">4→3: 1</text><text x="20" y="266" font-size="12" font-weight="600" fill="#5d6188" text-anchor="start">Biến</text><rect x="20" y="274" width="95.39999999999999" height="28" rx="8" fill="#fdebd6" stroke="#ea7a12" stroke-width="1.5"/><text x="29" y="293" font-size="13" font-weight="400" fill="#1b1d3a" text-anchor="start" font-family="JetBrains Mono, Consolas, monospace">luồng = 2</text></svg>